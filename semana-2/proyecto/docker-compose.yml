services:
  api:
    build: ./api
    container_name: cian_api
    hostname: backend
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/cielum_db
      # Parte 7: la API avisa a n8n cada vez que se crea un pedido
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/pedido-creado
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN:-cielum-token-dev}
    depends_on:
      - postgres
      - sqlserver
    networks:
      - red-cielum

  postgres:
    image: postgres:15-alpine
    container_name: cian_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: cielum_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - red-cielum

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cian_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "Password123*"
    ports:
      - "1433:1433"
    networks:
      - red-cielum

  adminer:
    image: adminer
    container_name: cian_adminer
    ports:
      - "8080:8080"
    networks:
      - red-cielum

  frontend:
    build:
      context: ./frontend-react
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - red-cielum

  frontend-vue:
    build:
      context: ./frontend-vue
      args:
        VITE_API_URL: /api
    ports:
      - "5174:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - red-cielum

  # ---------- Parte 7: automatizacion ----------
  n8n:
    image: n8nio/n8n:latest
    container_name: cian_n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # Permite usar $env.VARIABLE dentro de los flujos (credenciales de Zoho, token del webhook)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      # Carpeta donde los flujos pueden leer/escribir archivos (ejercicio basico)
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN:-cielum-token-dev}
    env_file:
      - path: ./n8n/.env          # credenciales de Zoho y correo (copiar de n8n/.env.example)
        required: false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/archivos:/files
      - ./n8n:/workflows:ro      # para importar los .json con la CLI de n8n
    depends_on:
      - postgres
      - mailpit
    restart: unless-stopped
    networks:
      - red-cielum

  # Servidor SMTP de pruebas: atrapa todos los correos y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: cian_mailpit
    ports:
      - "8025:8025"   # bandeja web
      - "1025:1025"   # SMTP
    restart: unless-stopped
    networks:
      - red-cielum

volumes:
  pgdata:
  n8n_data:

networks:
  red-cielum:
    driver: bridge