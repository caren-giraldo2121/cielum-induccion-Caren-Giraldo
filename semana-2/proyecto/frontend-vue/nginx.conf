server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker. Con la variable, nginx resuelve "backend" en cada
  # petición y no se cae al arrancar si la API todavía no está encendida.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://backend:3000;

  # /api/loquesea  ->  http://backend:3000/loquesea
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA: cualquier ruta del router devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
